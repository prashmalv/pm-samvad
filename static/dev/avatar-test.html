<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Avatar test</title>
<style>html,body{margin:0;height:100%;background:#14122a}canvas{display:block;width:100%;height:100%}#info{position:fixed;left:10px;top:8px;color:#ddd;font:14px monospace;text-shadow:0 1px 2px #000}</style>
</head><body><div id="info">loading…</div><canvas id="c"></canvas>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
<script type="module">
// Dev-only: full-window avatar driven by /avatar-motion.  ?words=HELLO,NAME[&char=man][&model=variants/x.glb]  then window.show(t) seeks.
import { AvatarPlayer } from "../avatar.js";
const words = (new URLSearchParams(location.search).get("words") || "HELLO,YOUR,NAME,WHAT").split(",");
const model = new URLSearchParams(location.search).get("model");
const char = new URLSearchParams(location.search).get("char") || "woman";
const a = new AvatarPlayer(document.getElementById("c"), model ? { signerUrl: `../models/${model}` } : { character: char });
await a.ready;
const seq = await (await fetch("/avatar-motion", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tokens: words }) })).json();
a.load(seq);
const info = document.getElementById("info");
window.__a = a; window.__seq = seq;
window.show = (t, close = false) => {
  a.currentTime = t;
  const seg = seq.segments.find((s) => t >= s.start && t < s.end);
  info.textContent = `${seg ? seg.gloss : "(between signs)"} · ${t.toFixed(2)}s · ${a.human ? "realistic signer" : "simple avatar"}`;
  if (close) { a.camera.position.set(0, 1.3, 1.1); a.controls.target.set(0, 1.25, 0); } else a.resetView();
  a.controls.update();
};
show(seq.segments[0] ? (seq.segments[0].start + seq.segments[0].end) / 2 : 0);
</script></body></html>
