<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--bg); color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, sans-serif; margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 22px; margin: 0; }
  .counts { color: var(--ink-2); font-size: 14px; }
  .counts b { color: var(--ink); }
  .help { color: var(--muted); font-size: 14px; margin: 8px 0 20px; max-width: 70ch; line-height: 1.5; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .word { font-size: 34px; font-weight: 800; letter-spacing: .02em; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; font-family: "JetBrains Mono", monospace; margin: 4px 0 16px; }
  .clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .clip { display: flex; flex-direction: column; gap: 10px; }
  video { width: 100%; aspect-ratio: 16 / 9; background: var(--stage); border-radius: 12px; }
  button { font: inherit; font-weight: 700; border-radius: 12px; border: 1px solid var(--line); padding: 12px 16px; cursor: pointer; background: var(--surface-2); color: var(--ink); }
  button.ok { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
  button.no { background: var(--err-soft); color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  kbd { font-family: "JetBrains Mono", monospace; font-size: 12px; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; opacity: .7; }
  .empty { text-align: center; color: var(--ink-2); padding: 48px 16px; }
  .err { color: var(--err); margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Review auto-cut signs</h1>
    <div class="counts" id="counts"></div>
  </header>
  <p class="help">These clips were cut automatically from long ISLRTC videos, which show the word sign and then
    explain it. Approve the clip that shows <b>only the sign for the word</b>, not fingerspelling or explanation.
    If neither does, reject it and the word stays out of the library.</p>
  <div id="main"></div>
</div>
<script type="module">
const main = document.getElementById("main");
const counts = document.getElementById("counts");
let queue = [], busy = false;

async function load() {
  const res = await fetch("/review/items");
  const data = await res.json();
  queue = data.pending;
  const c = data.counts;
  counts.innerHTML = `<b>${c.pending}</b> to review · <b>${c.approved}</b> approved · <b>${c.rejected}</b> rejected`;
  show();
}

function show() {
  const item = queue[0];
  if (!item) {
    main.innerHTML = `<div class="card empty">Nothing left to review.</div>`;
    return;
  }
  const clips = item.clips.map((url, i) => `
    <div class="clip">
      <video src="${url}" autoplay muted loop playsinline controls></video>
      <button class="ok" data-choice="${i + 1}">Approve clip ${i + 1} <kbd>${i + 1}</kbd></button>
    </div>`).join("");
  main.innerHTML = `
    <div class="card">
      <p class="word">${item.gloss.replaceAll("-", " ")}</p>
      <p class="meta">${item.source} · full video ${item.duration ?? "?"} s</p>
      <div class="clips">${clips}</div>
      <div class="row">
        <button class="no" data-choice="none">Neither is the sign <kbd>X</kbd></button>
        <button data-skip>Skip for now <kbd>S</kbd></button>
      </div>
      <div class="err" id="err"></div>
    </div>`;
}

async function decide(choice) {
  const item = queue[0];
  if (!item || busy) return;
  busy = true;
  main.querySelectorAll("button").forEach(b => (b.disabled = true));
  try {
    const res = await fetch(`/review/${encodeURIComponent(item.gloss)}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ choice }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    await load();
  } catch (e) {
    main.querySelectorAll("button").forEach(b => (b.disabled = false));
    document.getElementById("err").textContent = `Could not save: ${e.message}`;
  } finally {
    busy = false;
  }
}

function skip() {
  if (queue.length > 1) queue.push(queue.shift());
  show();
}

main.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.hasAttribute("data-skip")) return skip();
  decide(b.dataset.choice === "none" ? null : Number(b.dataset.choice));
});

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea") || !queue[0]) return;
  const n = Number(e.key);
  if (n >= 1 && n <= queue[0].clips.length) decide(n);
  else if (e.key.toLowerCase() === "x") decide(null);
  else if (e.key.toLowerCase() === "s") skip();
});

load();
</script>
</body>
</html>
